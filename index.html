  <style>
    /* Custom Scrollbar for Controls */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 17, 23, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(212, 175, 55, 0.6);
    }

    .glass-panel {
      background: rgba(19, 21, 27, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .active-tab {
      color: #D4AF37;
      border-bottom: 2px solid #D4AF37;
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      background: #232733;
      border-radius: 4px;
      height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 16px;
      width: 16px;
      border-radius: 50%;
      background: #D4AF37;

      box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
      transition: transform 0.1s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {

    .btn-select-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

      border-color: #D4AF37;
      background-color: rgba(212, 175, 55, 0.12);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
    }
  
.no-scrollbar{scrollbar-width:none}.no-scrollbar::-webkit-scrollbar{display:none}
.swatch.selected{box-shadow:0 0 0 2px #0b0c10,0 0 0 4px #D4AF37}

      matte_olive: { name: 'Verde Oliva', type: 'acetate', color: 0x3b4234, roughness: 0.65, metalness: 0.0, clearcoat: 0.0 },

      metal_rosegold: { name: 'Oro Rosa', type: 'metal', color: 0xb76e79, roughness: 0.18, metalness: 0.92 },

      // Naturali e tecnici (texture procedurali)
      wood_walnut: { name: 'Legno Noce', type: 'wood', baseColor: '#5b3a22', spotColor: '#2a160a' },

    const LENS_COLORS_DB = {
      smoke: { name: 'Grigio Fumo', color: 0x22252a },
      g15: { name: 'Verde G-15', color: 0x1e3024 },
      sepia: { name: 'Marrone Seppia', color: 0x422617 },
      ocean: { name: 'Blu Oceano', color: 0x102a45 },
      amber: { name: 'Ambra Guida', color: 0xb57c1e },
      pink: { name: 'Rosa Tramonto', color: 0xa83b6b },
      purple: { name: 'Viola Deep', color: 0x3d1c47 },
      sport_blue: { name: 'Blu Sport', color: 0x1f5fa8 },
      sport_lime: { name: 'Lime Contrasto', color: 0xa6c21a },
      mirror_silver: { name: 'Specchio Argento', color: 0xd9d9d9, mirror: true },
      mirror_gold: { name: 'Specchio Oro', color: 0xdfb750, mirror: true },

</script>
  <script>
    // =========================================================================
    // THREE.JS SETUP & SCENE GLOBALS
    // =========================================================================
    let scene, camera, renderer, controls;
    let eyewearGroup; // Main container for all 3D mesh components
    let studioLightKey, studioLightFill, studioLightRim;
    let proceduralTextures = {};

    // 3D Sub-meshes references for dynamic updates
    let frontMesh = null;
    let leftTempleMesh = null;
    let rightTempleMesh = null;
    let bridgeMesh = null;
    let leftLensMesh = null;
    let rightLensMesh = null;
    let rivetsGroup = null;
    let engravingMesh = null;

    window.onload = function() {
      initThreeJS();
      generateProceduralTextures();
      generateMaterialTextures();
      initUI();
      buildEyewear3D();
      animate();
    };

    // =========================================================================
    // THREE.JS INITIALIZATION
    // =========================================================================
    function initThreeJS() {
      const container = document.getElementById('viewport-container');
      const canvas = document.getElementById('webgl-canvas');

      // Scene
      scene = new THREE.Scene();
      scene.background = C(0x0b0c10);

      // Camera
      camera = new THREE.PerspectiveCamera(35, container.clientWidth / container.clientHeight, 0.1, 100);
      camera.position.set(0, 5, 22);

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;

      // OrbitControls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 45;
      controls.minDistance = 8;
      controls.target.set(0, 0, 0);

      // Lights Studio Setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
      scene.add(ambientLight);

      studioLightKey = new THREE.DirectionalLight(0xfff5ea, 1.8);
      studioLightKey.position.set(12, 18, 15);
      studioLightKey.castShadow = true;
      studioLightKey.shadow.mapSize.width = 2048;
      studioLightKey.shadow.mapSize.height = 2048;
      Object.assign(studioLightKey.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 });
      studioLightKey.shadow.bias = -0.0005;
      scene.add(studioLightKey);

      studioLightFill = new THREE.DirectionalLight(0xdbeafe, 1.0);
      studioLightFill.position.set(-15, 10, -10);
      scene.add(studioLightFill);

      studioLightRim = new THREE.DirectionalLight(0xffffff, 1.2);
      studioLightRim.position.set(0, -12, -15);
      scene.add(studioLightRim);

      // Soft Ground Studio Plane
      const groundGeo = new THREE.PlaneGeometry(100, 100);
      const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -6;
      ground.receiveShadow = true;
      scene.add(ground);

      // Eyewear Container Group
      eyewearGroup = new THREE.Group();
      scene.add(eyewearGroup);

      // Responsive Resize Listener
      buildEnvironment();
      new ResizeObserver(onWindowResize).observe(container);
    }

    function onWindowResize() {
      const container = document.getElementById('viewport-container');
      if (!container.clientWidth || !container.clientHeight) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      
      if (state.autoRotate && eyewearGroup) {
        eyewearGroup.rotation.y += 0.008;
      }
      
      if (typeof tryOnTick === 'function') tryOnTick();
      controls.update();
      renderer.render(scene, typeof activeCamera === 'function' ? activeCamera() : camera);
    }

    // =========================================================================
    // PROCEDURAL TEXTURES (Tortoiseshell & Engravings)
    // =========================================================================
    function generateProceduralTextures() {
      // 1. Tortoiseshell Canvas Texture Generator
      ['tortoise_classic', 'tortoise_honey', 'tortoise_dark'].forEach(key => {
        const matData = MATERIALS_DB[key];
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = matData.baseColor;
        ctx.fillRect(0, 0, 512, 512);

        // Organic dark spots
        ctx.fillStyle = matData.spotColor;
        for (let i = 0; i < 400; i++) {
          const x = Math.random() * 512;
          const y = Math.random() * 512;
          const r = 5 + Math.random() * 25;
          ctx.beginPath();
          ctx.ellipse(x, y, r, r * (0.3 + Math.random() * 0.7), Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.encoding = THREE.sRGBEncoding;
        texture.wrapS = THREE.RepeatWrapping;

function resetModel() {

function initModeler() {
  const c = document.getElementById('viewport-container'), bar = document.createElement('div');
  bar.id = 'model-bar-wrap'; bar.className = 'absolute top-4 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-1 max-w-[92%]';
  const btn = 'px-2.5 py-1 text-xs rounded-lg bg-slate-800/90 text-slate-200 hover:bg-brand-gold hover:text-black transition whitespace-nowrap';
  bar.innerHTML = `<div id="model-bar" class="flex flex-wrap justify-center items-center gap-1.5 bg-slate-900/80 backdrop-blur-md p-1.5 rounded-xl border border-slate-700/60 shadow-xl">
      <button data-m="toggle" class="${btn}"><i class="fa-solid fa-pen-ruler mr-1"></i>Modella</button>
      <button data-m="tryon" class="${btn}"><i class="fa-solid fa-camera mr-1"></i>Prova</button>
      ${Object.entries(MODE_INFO).map(([k, v]) => `<button data-m="${k}" class="${btn} hidden">${v[0]}</button>`).join('')}
      <button data-m="p+" data-for="pts thick" class="${btn} hidden" title="Aggiungi un punto dopo quello selezionato">＋ punto</button>
      <button data-m="p-" data-for="pts thick" class="${btn} hidden" title="Elimina il punto selezionato">− punto</button>
      <button data-m="p2" data-for="pts thick" class="${btn} hidden" title="Raddoppia i punti">×2</button>
      <button data-m="t+" data-for="asta" class="${btn} hidden" title="Più punti sul profilo dell’asta">＋ profilo</button>
      <button data-m="t-" data-for="asta" class="${btn} hidden" title="Meno punti sul profilo dell’asta">− profilo</button>
      <button data-m="reset" class="${btn} hidden" title="Ripristina forma">↺</button>
      <span data-m="sep" class="hidden w-px h-4 bg-slate-600 mx-0.5"></span>
      ${[['front', 'Fronte'], ['side', 'Lato'], ['top', 'Alto'], ['3q', '3/4']].map(([k, n]) => `<button data-m="v:${k}" class="${btn} hidden">${n}</button>`).join('')}</div>
    <div id="model-hint" class="hidden text-[11px] text-brand-gold bg-slate-900/80 px-2 py-0.5 rounded-md"></div>`;
  c.appendChild(bar);
  bar.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const m = b.dataset.m;
    if (m === 'toggle') setModelMode(modelMode ? null : 'pts');
    else if (m === 'reset') resetModel();
    else if (m === 'sep') return;
    else if (m === 'tryon') toggleTryOn();
    else if (m === 'p+') addPoint(); else if (m === 'p-') delPoint(); else if (m === 'p2') doublePoints();

  let pend = false; const later = () => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; buildEyewear3D(); }); };

    if (dragH.kind === 'pts' || dragH.kind === 'thick') selPt = dragH.i; e.stopImmediatePropagation();

  cv.addEventListener('pointermove', e => {
    if (!dragH) return;

    if (!rc.ray.intersectPlane(pl, pt)) return;
    const w = state.lensWidth / 10, h = state.lensHeight / 10, bw = state.bridgeWidth / 10, a = w / 2, b = h / 2, cx = w / 2 + bw / 2, rt = state.thickness / 10, k = dragH.kind;
    if (k === 'pts') state.customPts[dragH.i] = [clamp((pt.x - cx) / a, -1.5, 1.5), clamp(pt.y / b, -1.5, 1.5)];
    else if (k === 'thick') {
      const p = state.customPts[dragH.i];

    else if (k === 'bridge') { state.bridgeWidth = clamp(Math.round(pt.x * 20), 14, 24); state.bridgeY = clamp((pt.y - h * 0.2) / h, -0.12, 0.25); }

// ---- Più punti di controllo: la nuova posizione è presa dalla curva, quindi la forma non cambia ----------------
const curveOf = q => new THREE.CatmullRomCurve3(q.map(p => V3(p[0], p[1], 0)), true, 'centripetal');

  const i = selPt % n, p = curveOf(q).getPoint((i + 0.5) / n);
  q.splice(i + 1, 0, [p.x, p.y]); W.splice(i + 1, 0, (W[i] + W[(i + 1) % n]) / 2); selPt = i + 1;
  buildEyewear3D();
}
function delPoint() {
  const q = state.customPts, W = state.customW;
  if (!q || q.length <= 6) return showToast('Servono almeno 6 punti');
  const i = selPt % q.length; q.splice(i, 1); W.splice(i, 1); selPt = Math.max(0, i - 1);
  buildEyewear3D();
}
function doublePoints() {
  ensureCustom();
  const q = state.customPts, W = state.customW, n = q.length;
  if (n * 2 > 48) return showToast('Massimo 48 punti');
  const c = curveOf(q), nq = [], nw = [];
  q.forEach((p, i) => { const m = c.getPoint((i + 0.5) / n); nq.push(p, [m.x, m.y]); nw.push(W[i], (W[i] + W[(i + 1) % n]) / 2); });
  state.customPts = nq; state.customW = nw; selPt = (selPt * 2) % nq.length;
  buildEyewear3D();
}
// Profilo dell'asta con più (o meno) punti, mantenendo la forma attuale
function resampleProf(dir) {
  ensureTempleProf();
  const T = TEMPLES[state.templeStyle] || TEMPLES.curved, n = state.templeProf.length + dir;
  if (n < 3 || n > 11) return showToast(n < 3 ? 'Servono almeno 3 punti' : 'Massimo 11 punti');
  state.templeProf = tuOf(n).map(u => tempH(u, T));
  buildEyewear3D();

  <script>
// =========================================================================
// PROVA CON WEBCAM: tracking del volto (MediaPipe Face Landmarker) + posa 3D
// 1 unità del modello = 1 cm: la montatura viene posta a misura reale sul volto.
// =========================================================================
const TRY = { active: false, busy: false, fov: 50, mirror: true, lost: 0, last: -1, have: false, pos: new THREE.Vector3(), quat: new THREE.Quaternion(), landmarker: null };
const MP_VER = '0.10.14', MP_BASE = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
Object.assign(state, { tryIPD: 63, tryY: 0, tryZ: 15, tryTilt: 6 });

function activeCamera() { return TRY.active ? TRY.cam : camera; }

// ---- Calcolo della posa dai landmark (funzione pura, testabile) ---------------------------------------------
// L: 478 landmark normalizzati; mat: matrice 4x4 di MediaPipe (o null); misure in px del canvas e del video.
function headPose(L, mat, cw, ch, vw, vh, fovDeg, ipdCm) {
  const sc = Math.max(cw / vw, ch / vh), dw = vw * sc, dh = vh * sc, ox = (cw - dw) / 2, oy = (ch - dh) / 2;
  const f = (ch / 2) / Math.tan(fovDeg * Math.PI / 360), iR = 468, iL = 473;
  const px = i => ox + L[i].x * dw, py = i => oy + L[i].y * dh;
  const ipdPx = Math.hypot(px(iL) - px(iR), py(iL) - py(iR), (L[iL].z - L[iR].z) * dw) || 1;   // distanza 3D: indipendente dalla rotazione

  const P = i => { const d = d0 + (L[i].z - zRef) * dw * cmPx; return new THREE.Vector3((px(i) - cw / 2) / f * d, -(py(i) - ch / 2) / f * d, -d); };
  const a = P(iR), b = P(iL), mid = a.clone().add(b).multiplyScalar(0.5), faceW = P(234).distanceTo(P(454));
  let xA = null, yA = null, zA = null;
  if (mat && mat.length === 16) {   // la matrice può essere per colonne o per righe: la riconosco dalla riga finale
    const m = (Math.abs(mat[15] - 1) < 1e-3 && Math.abs(mat[3]) < 1e-3) ? mat : [0, 4, 8, 12, 1, 5, 9, 13, 2, 6, 10, 14, 3, 7, 11, 15].map(k => mat[k]);
    const x = new THREE.Vector3(m[0], m[1], m[2]).normalize(), y = new THREE.Vector3(m[4], m[5], m[6]).normalize(), z = new THREE.Vector3(m[8], m[9], m[10]).normalize();
    if (x.x > 0 && z.z > 0) { xA = x; yA = y; zA = z; }   // convenzione attesa: x a destra, z verso la camera
  }

// ---- Avvio / arresto -----------------------------------------------------------------------------------------
async function toggleTryOn() { return TRY.active ? stopTryOn() : startTryOn(); }

async function startTryOn() {
  if (TRY.active || TRY.busy) return;
  TRY.busy = true;
  try {
    if (typeof modelMode !== 'undefined' && modelMode) setModelMode(null);
    showToast('Avvio fotocamera…');
    TRY.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    const v = TRY.video = document.createElement('video');
    v.playsInline = true; v.muted = true; v.srcObject = TRY.stream; await v.play();
    if (!TRY.landmarker) {
      showToast('Carico il tracking del volto…');
      const mp = await import(`${MP_BASE}/vision_bundle.mjs`), fs = await mp.FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
      const opts = delegate => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true });
      try { TRY.landmarker = await mp.FaceLandmarker.createFromOptions(fs, opts('GPU')); } catch (e) { TRY.landmarker = await mp.FaceLandmarker.createFromOptions(fs, opts('CPU')); }

  } catch (e) {
    console.error(e);

    showToast(denied ? 'Fotocamera non disponibile: consenti l’accesso o apri il file nel browser' : 'Tracking non caricato: serve la connessione internet');
  } finally { TRY.busy = false; }
}

function enterTryScene() {

  TRY.bg = scene.background; scene.background = null;
  TRY.ground = scene.children.find(o => o.material && o.material.type === 'ShadowMaterial'); if (TRY.ground) TRY.ground.visible = false;
  state.autoRotate = false; document.getElementById('btn-autorotate').classList.remove('bg-brand-gold', 'text-black');
  eyewearGroup.rotation.set(0, 0, 0); eyewearGroup.visible = false; TRY.have = false; TRY.lost = 99;
  controls.enabled = false; c.style.transform = TRY.mirror ? 'scaleX(-1)' : '';

}

function stopTryOn(silent) {
  if (TRY.stream) TRY.stream.getTracks().forEach(t => t.stop());
  TRY.stream = null;
  if (TRY.active || TRY.plane) {
    if (TRY.plane) { scene.remove(TRY.plane); TRY.plane.geometry.dispose(); TRY.plane.material.dispose(); TRY.vt.dispose(); TRY.plane = null; }
    if (TRY.head) { scene.remove(TRY.head); TRY.head = null; }

    eyewearGroup.visible = true; eyewearGroup.position.set(0, 0, 0); eyewearGroup.quaternion.identity();
    controls.enabled = true; renderer.domElement.style.transform = '';

  }
  TRY.active = false;
  const bar = document.getElementById('model-bar-wrap'); if (bar) bar.style.display = '';
  if (TRY.panel) { TRY.panel.remove(); TRY.panel = null; }

}

// ---- Pannello comandi ---------------------------------------------------------------------------------------
function buildTryPanel() {
  const p = TRY.panel = document.createElement('div');
  p.className = 'absolute top-16 left-1/2 -translate-x-1/2 z-20 w-[min(92%,340px)] bg-slate-900/85 backdrop-blur-md p-3 rounded-xl border border-slate-700/60 shadow-xl space-y-2';
  const sl = (k, l, min, max, u) => `<div><div class="flex justify-between text-[11px] text-slate-400"><span>${l}</span><span class="font-mono text-brand-gold" data-tv="${k}"></span></div><input type="range" class="w-full" data-tk="${k}" min="${min}" max="${max}" step="1" value="${state[k]}"></div>`;
  p.innerHTML = `<div class="flex items-center justify-between gap-2">
      <span class="text-xs font-bold text-brand-gold"><i class="fa-solid fa-camera mr-1"></i>Prova con webcam</span>
      <div class="flex gap-1">
        <button data-a="mirror" class="px-2 py-1 text-[11px] rounded-lg bg-slate-800 hover:bg-slate-700">Specchio</button>
        <button data-a="photo" class="px-2 py-1 text-[11px] rounded-lg bg-slate-800 hover:bg-slate-700"><i class="fa-solid fa-image"></i> Foto</button>
        <button data-a="close" class="px-2 py-1 text-[11px] rounded-lg bg-brand-gold text-black font-bold">✕</button></div></div>
    <div id="try-status" class="text-[11px] text-slate-300">Cerco il viso…</div>
    ${sl('tryIPD', 'Distanza pupillare (scala sul viso)', 54, 74, 'mm')}${sl('tryY', 'Altezza sul naso', -10, 10, 'mm')}${sl('tryZ', 'Distanza dagli occhi', 0, 30, 'mm')}${sl('tryTilt', 'Inclinazione', 0, 15, '°')}`;
  document.getElementById('viewport-container').appendChild(p);
  const upd = () => p.querySelectorAll('[data-tv]').forEach(e => e.textContent = state[e.dataset.tv] + (e.dataset.tv === 'tryTilt' ? '°' : ' mm'));
  p.querySelectorAll('[data-tk]').forEach(i => i.oninput = () => { state[i.dataset.tk] = parseFloat(i.value); upd(); });

  p.querySelector('[data-a="mirror"]').onclick = () => { TRY.mirror = !TRY.mirror; renderer.domElement.style.transform = TRY.mirror ? 'scaleX(-1)' : ''; };
}

function tryOnPhoto() {

// ---- Ciclo: chiamato a ogni frame da animate() ---------------------------------------------------------------
function tryOnTick() {

  TRY.head.position.copy(P.mid.clone().add(new THREE.Vector3(0, -1.2, -7.6).applyQuaternion(hq))); TRY.head.quaternion.copy(hq);
  TRY.head.scale.set(rx, 10.5, 8.3); TRY.head.visible = true;
  if (status) status.textContent = `Viso rilevato · distanza ≈ ${Math.round(P.depth)} cm · larghezza viso ≈ ${P.faceW.toFixed(1)} cm`;
}
